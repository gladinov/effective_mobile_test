services:
  app:
    build:
      context: .
      dockerfile: ./deployments/docker/app.Dockerfile
    container_name: app
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      ENV: ${ENV}
      HOST: ${HOST}
      PORT: ${PORT}
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGUSER: ${PGUSER}
      SSLMODE: ${SSLMODE}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT}
      APP_CLOSE_TIMEOUT: ${APP_CLOSE_TIMEOUT}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT}
    ports:
      - "${PORT}:8080"
    networks:
      - app_network
      


  postgres-db:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGUSER: ${PGUSER}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5


  migrator:
    build:
      context: .
      dockerfile: ./deployments/docker/migrator.Dockerfile
    container_name: migrator_postgres
    restart: no
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      ENV: ${ENV}
      MIGRATIONS_PATH: "/usr/local/src/migrations"
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGUSER: ${PGUSER}
      SSLMODE: ${SSLMODE}
    volumes:
      - ./deployments/migrations/postgreSQL:/usr/local/src/migrations:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
